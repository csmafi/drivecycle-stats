[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivecycle-stats"
version = "0.1.0"
description = "Descriptive analysis and two-sample statistical comparison of driving-cycle data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Shahab Mafi", email = "csmafi@gmail.com" }
]
keywords = ["driving cycle", "vehicle energy", "microtrip", "energy distance", "TOST"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
notebooks = ["jupyter", "openpyxl"]

[project.urls]
Homepage = "https://codeberg.org/csmafi/drivecycle-stats"
Mirror = "https://github.com/csmafi/drivecycle-stats"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["EXE002"]
